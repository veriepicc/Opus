name: Main CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build compiler / Windows Server 2022 / x64
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build Release x64
        run: ./tools/ci-build.ps1
      - name: Upload compiler
        uses: actions/upload-artifact@v4
        with:
          name: sable-windows-x64
          path: bin/Release/sable.exe
          if-no-files-found: error

  windows-tests:
    name: Tests / ${{ matrix.os }} / x64
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - uses: actions/download-artifact@v4
        with:
          name: sable-windows-x64
          path: bin/Release/
      - name: Run tests
        run: python tests/test_runner.py -v
      - name: Run compiler tests
        run: python tests/run.py --verbose --report test-results.json
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}
          path: test-results.json

  benchmarks:
    name: Benchmarks / ${{ matrix.name }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            id: win-2025
            name: Windows Server 2025 / x64
            use_msvc_dev: true
          - os: windows-2022
            id: win-2022
            name: Windows Server 2022 / x64
            use_msvc_dev: true
          - os: windows-11-arm
            id: win-arm64
            name: Windows 11 on Arm / ARM64 (Prism x64)
            use_msvc_dev: false
          - os: ubuntu-24.04
            id: ubuntu-wine
            name: Ubuntu 24.04 / Wine x64
            use_msvc_dev: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Setup MSVC environment
        if: matrix.use_msvc_dev
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Wine and MinGW on Linux
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wine wine64 xvfb gcc-mingw-w64-x86-64
          mkdir -p "$HOME/.wine"
          wineserver -p
          WINEDEBUG=-all wineboot --init
          sleep 20
      - uses: actions/download-artifact@v4
        with:
          name: sable-windows-x64
          path: bin/Release/
      - name: Measure toolchains
        run: python benchmarks/run.py --iterations 5 --warmup 2
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.id }}
          path: |
            benchmark-results.json
            benchmark-summary.md
            BENCHMARKS.md

  linux-wine:
    name: Tests / Ubuntu / Wine / x64
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Wine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wine wine64 xvfb
      - uses: actions/download-artifact@v4
        with:
          name: sable-windows-x64
          path: bin/Release/
      - name: Run tests under Wine
        run: python3 tests/test_runner.py -v
      - name: Run compiler tests under Wine
        run: python3 tests/run.py --verbose --report test-results.json
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-ubuntu-wine
          path: test-results.json

  readme:
    name: Publish reports to ci-results
    needs: [build, windows-tests, linux-wine, benchmarks]
    if: always() && !cancelled() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: ci-results
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          path: ci-results
      - name: Publish generated reports
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_RESULT: ${{ needs.build.result }}
          RESULTS_DIR: ${{ runner.temp }}/ci-results-site
        run: |
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$SOURCE_SHA" ]; then
            echo 'A newer commit is on main; leaving its results untouched.'
            exit 0
          fi
          python tools/update-ci-status.py ci-results --output "$RESULTS_DIR" --run-url "$RUN_URL" --commit "$SOURCE_SHA" --build-result "$BUILD_RESULT"
          parent=()
          if [ -n "$(git ls-remote origin refs/heads/ci-results)" ]; then
            git fetch origin refs/heads/ci-results:refs/remotes/origin/ci-results
            parent=(-p "$(git rev-parse origin/ci-results)")
          fi
          export GIT_INDEX_FILE="$RUNNER_TEMP/ci-results.index"
          export GIT_DIR="$(git rev-parse --absolute-git-dir)"
          export GIT_WORK_TREE="$RESULTS_DIR"
          cd "$RESULTS_DIR"
          git read-tree --empty
          git add README.md BENCHMARKS.md build.svg tests.svg benchmarks.svg
          tree=$(git write-tree)
          commit=$(printf 'ci: reports for %s\n' "$SOURCE_SHA" | git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$tree" "${parent[@]}")
          git push origin "$commit:refs/heads/ci-results"
