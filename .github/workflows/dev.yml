name: Dev CI

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build compiler / Windows Server 2022 / x64
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build Release x64
        run: ./tools/ci-build.ps1
      - name: Upload compiler
        uses: actions/upload-artifact@v4
        with:
          name: sable-windows-x64-dev
          path: bin/Release/sable.exe
          if-no-files-found: error

  windows-tests:
    name: Tests / ${{ matrix.os }} / x64
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - uses: actions/download-artifact@v4
        with:
          name: sable-windows-x64-dev
          path: bin/Release/
      - name: Run tests
        run: python tests/test_runner.py -v
      - name: Run compiler tests
        run: python tests/run.py --verbose --report test-results.json

  linux-wine:
    name: Tests / Ubuntu / Wine / x64
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Wine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wine wine64 xvfb
      - uses: actions/download-artifact@v4
        with:
          name: sable-windows-x64-dev
          path: bin/Release/
      - name: Run tests under Wine
        run: python3 tests/test_runner.py -v
      - name: Run compiler tests under Wine
        run: python3 tests/run.py --verbose --report test-results.json
